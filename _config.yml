title: 'Sturla Bragason'
author:
  name: Sturla Bragason
  email: sturla.bragason@proton.me

description: >
  Writing about some of the stuff I've been working on or thinking about, as time permits.

remote_theme: jekyll/minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-spaceship
#   - jekyll-toc

minima:
  # `auto` emits minima's colours as CSS custom properties and wraps the dark set
  # in a prefers-color-scheme query. _sass/minima/custom-styles.scss overrides
  # those properties with the warm-editorial palette, so both modes come from one
  # source. `classic` would hard-code light values and break dark mode.
  skin: auto
  date_format: "%b %-d, %Y"
  show_excerpts: true
  nav_pages:
    - cv/index.html
    - services/index.html
  social_links:
    - { title: "GitHub", icon: "github", url: "https://github.com/sturlabragason" }
    - { title: "Mastodon", icon: "mastodon", url: "https://mastodon.social/@sturlabragason" }
    - { title: "LinkedIn", icon: "linkedin", url: "https://www.linkedin.com/in/sturlabragason/" }

jekyll-spaceship:
  # Keeping the default processor list; only mermaid's rendering is tuned.
  mermaid-processor:
    mode: default
    css:
      class: mermaid
    config:
      theme: neutral

collections:
  my_collection:
    output: true  # This makes sure the collection is rendered as web pages
    permalink: /:collection/:path/
